[workspace]
resolver = "2"
members = [
    "crates/vector-core",
    "crates/vector-render",
    "crates/vector-io",
    "crates/anyvector",
    "xtask",
]
# vendor/egui is egui 0.37.0 with AnyVector's user interface translator (see vendor/egui/README.md)
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["AnyVector Team"]
license = "Proprietary"

[workspace.dependencies]
vector-core = { path = "crates/vector-core" }
vector-render = { path = "crates/vector-render" }
vector-io = { path = "crates/vector-io" }

serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
kurbo = { version = "0.13", features = ["serde"] }
tiny-skia = "0.12"
i_overlay = "9.1"
fontdb = "0.24"
rustybuzz = "0.20"
ttf-parser = "0.25"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "tiff", "webp", "gif", "ico", "tga"] }
usvg = "0.49"
resvg = "0.49"
roxmltree = "0.21"
flate2 = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }
eframe = "0.37"
egui = "0.37"
egui_extras = "0.37"
egui_kittest = "0.37"
rfd = "0.18"
rhai = { version = "1.27", features = ["sync"] }
dirs = "7"
arboard = "3.7"
log = "0.4"
parking_lot = "0.12"
ureq = { version = "3", features = ["json"] }
winresource = "0.1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

[patch.crates-io]
egui = { path = "vendor/egui" }
