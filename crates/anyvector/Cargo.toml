[package]
name = "anyvector"
version.workspace = true
edition.workspace = true
description = "AnyVector - vector graphics editor"

[[bin]]
name = "anyvector"
path = "src/main.rs"

[dependencies]
vector-core = { path = "../vector-core" }
vector-render = { path = "../vector-render" }
vector-io = { path = "../vector-io" }
eframe = { workspace = true }
egui = { workspace = true }
resvg = { workspace = true }
usvg = { workspace = true }
tiny-skia = { workspace = true }
kurbo = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
image = { workspace = true }
rfd = { workspace = true }
rhai = { workspace = true }
dirs = { workspace = true }
arboard = { workspace = true }
log = { workspace = true }
ureq = { workspace = true }
zip = { workspace = true }
# compresses the page images of the PDF a Linux print job sends to CUPS (already in the tree)
flate2 = { workspace = true }
thesaurus-wordnet = "0.2"
# the main window's handle, for coloring its border (already in the tree through eframe)
raw-window-handle = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
# OpenGL, the renderer AnyVector falls back to when wgpu can't start on the machine's graphics
# driver (see main.rs); the libraries are loaded at run time, so nothing new is needed to start
eframe = { workspace = true, features = ["glow"] }
# the Linux clipboard by MIME type (X11 selections, Wayland data-control): all already in the
# tree through eframe (arboard, winit), so no new crates
x11rb = { version = "0.13", default-features = false }
wl-clipboard-rs = "0.9"
rustix = { version = "1", default-features = false, features = ["std", "event"] }

[target.'cfg(windows)'.dependencies]
windows-core = "0.62"
# cheap clipboard format checks and a CF_DIB fallback for pasted bitmaps; already in the tree via arboard
clipboard-win = "5.4"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Printing",
    "Win32_Security",
    "Win32_Storage_EnhancedStorage",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Xps",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Mapi",
    "Win32_System_Ole",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = { workspace = true }

[dev-dependencies]
egui_kittest = { workspace = true, features = ["wgpu", "snapshot", "eframe"] }
