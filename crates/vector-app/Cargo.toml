[package]
name = "vector-app"
version.workspace = true
edition.workspace = true
description = "AnyVector - vector graphics editor"

[[bin]]
name = "anyvector"
path = "src/main.rs"

[dependencies]
vector-core = { path = "../vector-core" }
vector-render = { path = "../vector-render" }
vector-io = { path = "../vector-io" }
eframe = { workspace = true }
egui = { workspace = true }
resvg = { workspace = true }
usvg = { workspace = true }
tiny-skia = { workspace = true }
kurbo = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
image = { workspace = true }
rfd = { workspace = true }
rhai = { workspace = true }
dirs = { workspace = true }
arboard = { workspace = true }
log = { workspace = true }
ureq = { workspace = true }
zip = { workspace = true }
thesaurus-wordnet = "0.2"

[target.'cfg(windows)'.dependencies]
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Printing",
    "Win32_Security",
    "Win32_Storage_EnhancedStorage",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Xps",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Mapi",
    "Win32_System_Ole",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = { workspace = true }

[dev-dependencies]
egui_kittest = { workspace = true, features = ["wgpu", "snapshot", "eframe"] }
